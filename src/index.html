<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Weather 3D Flythrough</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #cesiumContainer {
      width: 100%;
      height: 100%;
    }
    #rainOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <canvas id="rainOverlay"></canvas>

  <script>
    window.CONFIG = {
      locations: [
        {
          name: "Grandvoir, Belgium",
          lat: 50.1,
          lon: 5.37,
          days: [
            { label: "Wed 26", low: 17, high: 25, condition: "Partly cloudy", rain: 21 },
            { label: "Thu 27", low: 15, high: 27, condition: "PM thunderstorms", rain: 40 },
            { label: "Fri 28", low: 12, high: 19, condition: "Thunderstorms", rain: 61 },
            { label: "Sat 29", low: 14, high: 18, condition: "Light rain", rain: 52 },
            { label: "Sun 30", low: 12, high: 21, condition: "Showers", rain: 56 },
            { label: "Mon 31", low: 10, high: 18, condition: "Showers", rain: 64 },
            { label: "Tue 1", low: 12, high: 21, condition: "Partly cloudy", rain: 21 }
          ]
        },
        {
          name: "Vianden, Luxembourg",
          lat: 49.9,
          lon: 6.2,
          days: [
            { label: "Wed 26", low: 17, high: 26, condition: "Partly cloudy", rain: 16 },
            { label: "Thu 27", low: 17, high: 28, condition: "Mostly cloudy", rain: 17 },
            { label: "Fri 28", low: 14, high: 21, condition: "Rain & thunder", rain: 56 },
            { label: "Sat 29", low: 16, high: 19, condition: "Showers", rain: 42 },
            { label: "Sun 30", low: 14, high: 22, condition: "AM showers", rain: 36 },
            { label: "Mon 31", low: 12, high: 19, condition: "Showers", rain: 54 },
            { label: "Tue 1", low: 13, high: 22, condition: "Partly cloudy", rain: 17 }
          ]
        }
      ]
    };
  </script>

  <link rel="stylesheet" href="./cesium/Widgets/widgets.css">
  <script src="./cesium/Cesium.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>

  <script src="./main.js"></script>
</body>
</html>
